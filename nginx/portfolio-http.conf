# HTTP-only site. Used until a Let's Encrypt certificate exists (or forever,
# if you deploy without a domain). __SERVER_NAME__ is filled in by
# deploy/server-setup.sh.

limit_req_zone $binary_remote_addr zone=portfolio_api:1m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include snippets/portfolio-common.conf;
}
