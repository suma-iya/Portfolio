# Shared by the HTTP and HTTPS server blocks. Installed by
# deploy/server-setup.sh to /etc/nginx/snippets/portfolio-common.conf.

# Static site (frontend/) — uploaded by deploy/deploy.sh
root /var/www/portfolio;
index index.html;

client_max_body_size 64k;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location / {
    try_files $uri $uri/ =404;
}

# Images / CV rarely change; CSS/JS aren't fingerprinted, so keep them short.
# (`expires` sets Cache-Control itself. Avoid add_header in these blocks: in
# Nginx that would drop the security headers inherited from above.)
location /assets/ {
    expires 7d;
}
location ~* \.(?:css|js)$ {
    expires 1h;
}

# Go backend (listening on loopback only)
location /api/ {
    limit_req zone=portfolio_api burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (don't append) so clients can't inject a fake IP chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;   # covers the SMTP round-trip to Gmail
}

location = /health {
    proxy_pass http://127.0.0.1:8080;
    access_log off;
}
